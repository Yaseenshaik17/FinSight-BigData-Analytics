name=hdfs-sink-main

connector.class=io.confluent.connect.hdfs3.Hdfs3SinkConnector
storage.class=io.confluent.connect.hdfs3.storage.HdfsStorage
tasks.max=1

topics=txn-raw

# Uses standard Kafka Connect JSON converter to read your embedded schema
key.converter=org.apache.kafka.connect.storage.StringConverter
value.converter=org.apache.kafka.connect.json.JsonConverter
value.converter.schemas.enable=true

store.url=hdfs://localhost:9000
hadoop.conf.dir=/home/clouduser/bigdata/hadoop/etc/hadoop
hadoop.home=/home/clouduser/bigdata/hadoop

topics.dir=/finsight/raw/transactions
logs.dir=/finsight/connect-logs

format.class=io.confluent.connect.hdfs3.parquet.ParquetFormat
partitioner.class=io.confluent.connect.storage.partitioner.FieldPartitioner
partition.field.name=step

flush.size=1000

confluent.topic.bootstrap.servers=localhost:9092
confluent.topic.replication.factor=1